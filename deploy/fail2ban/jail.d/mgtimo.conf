# Скопировать на хост:
#   /etc/fail2ban/filter.d/  ← filter.d/*
#   /etc/fail2ban/jail.d/    ← этот файл
# logpath поправить под абсолютный путь к deploy/logs/nginx/

[DEFAULT]
bantime  = 1h
findtime = 10m
maxretry = 8
backend  = auto

[sshd]
enabled = true

[mgtimo-nginx-limit]
enabled  = true
port     = http,https
filter   = mgtimo-nginx-limit
logpath  = /opt/mgtimo/deploy/logs/nginx/access.log
maxretry = 12
findtime = 5m
bantime  = 2h

# Включите, если docker logs web пишутся в файл (см. README).
[mgtimo-auth]
enabled  = false
port     = http,https
filter   = mgtimo-auth
logpath  = /opt/mgtimo/deploy/logs/app/web.json.log
maxretry = 8
findtime = 10m
bantime  = 1h
