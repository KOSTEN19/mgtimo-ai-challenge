# server_name задаётся через envsubst → mgtimo.conf из шаблона при старте,
# либо правьте DOMAIN в deploy/.env и пересоберите edge.
# По умолчанию: _ (любой Host) — удобно для IP; для домена поставьте имя.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    include /etc/nginx/snippets/ssl-params.conf;
    include /etc/nginx/snippets/security-headers.conf;

    limit_conn addr 40;
    limit_req zone=general burst=60 nodelay;

    location = /login {
        limit_req zone=login burst=12 nodelay;
        limit_req_status 429;
        include /etc/nginx/snippets/proxy-params.conf;
        proxy_pass http://mgtimo_web;
    }

    location / {
        include /etc/nginx/snippets/proxy-params.conf;
        proxy_pass http://mgtimo_web;
    }
}
