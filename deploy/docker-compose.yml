# Прод-стек: nginx (edge) → web (только внутренняя сеть).
# Из корня репозитория:
#   docker compose -f deploy/docker-compose.yml --env-file .env up -d --build
#
# Порт приложения наружу НЕ публикуется — только 80/443 через nginx.
# fail2ban ставится на ХОСТ и читает deploy/logs/nginx/*.log

name: mgtimo

services:
  web:
    build:
      context: ..
      dockerfile: Dockerfile
    image: mgtimo-cabinet:latest
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      SESSION_SECRET: ${SESSION_SECRET:?Задайте SESSION_SECRET в .env}
      DATABASE_URL: file:/data/mgtimo.db
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      TRUST_PROXY: "1"
    volumes:
      - mgtimo-data:/data
    networks:
      - app
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/login"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 45s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
        tag: "{{.Name}}"
    mem_limit: 1536m
    cpus: 2.0

  nginx:
    image: nginx:1.26-alpine
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/snippets:/etc/nginx/snippets:ro
      - ./certs:/etc/nginx/ssl:ro
      - ./logs/nginx:/var/log/nginx
      - ./certbot-www:/var/www/certbot:ro
    networks:
      - edge
      - app
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    mem_limit: 256m
    cpus: 1.0

networks:
  edge:
    driver: bridge
  app:
    driver: bridge
    internal: true

volumes:
  mgtimo-data:
